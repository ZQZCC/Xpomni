import java.security.MessageDigest
import java.util.zip.Adler32
import java.util.zip.ZipEntry
import java.util.zip.ZipFile
import java.util.zip.ZipOutputStream

plugins {
    id 'com.android.application'
}

int readIntLe(byte[] bytes, int offset) {
    (bytes[offset] & 0xff) |
            ((bytes[offset + 1] & 0xff) << 8) |
            ((bytes[offset + 2] & 0xff) << 16) |
            ((bytes[offset + 3] & 0xff) << 24)
}

void writeIntLe(byte[] bytes, int offset, int value) {
    bytes[offset] = (byte) value
    bytes[offset + 1] = (byte) (value >> 8)
    bytes[offset + 2] = (byte) (value >> 16)
    bytes[offset + 3] = (byte) (value >> 24)
}

int readUleb128(byte[] bytes, int[] offsetRef) {
    int result = 0
    int shift = 0
    int offset = offsetRef[0]
    while (true) {
        int value = bytes[offset++] & 0xff
        result |= (value & 0x7f) << shift
        if ((value & 0x80) == 0) break
        shift += 7
    }
    offsetRef[0] = offset
    result
}

void updateDexHashes(byte[] bytes) {
    def sha1 = MessageDigest.getInstance("SHA-1")
    sha1.update(bytes, 32, bytes.length - 32)
    System.arraycopy(sha1.digest(), 0, bytes, 12, 20)

    def adler32 = new Adler32()
    adler32.update(bytes, 12, bytes.length - 12)
    writeIntLe(bytes, 8, (int) adler32.value)
}

byte[] stripDexDebugInfo(byte[] input) {
    byte[] bytes = input.clone()
    int classDefsSize = readIntLe(bytes, 0x60)
    int classDefsOff = readIntLe(bytes, 0x64)

    for (int classIndex = 0; classIndex < classDefsSize; classIndex++) {
        int classDefOff = classDefsOff + classIndex * 32
        writeIntLe(bytes, classDefOff + 16, -1)

        int classDataOff = readIntLe(bytes, classDefOff + 24)
        if (classDataOff == 0) continue

        int[] cursor = [classDataOff] as int[]
        int staticFieldsSize = readUleb128(bytes, cursor)
        int instanceFieldsSize = readUleb128(bytes, cursor)
        int directMethodsSize = readUleb128(bytes, cursor)
        int virtualMethodsSize = readUleb128(bytes, cursor)

        for (int i = 0; i < staticFieldsSize + instanceFieldsSize; i++) {
            readUleb128(bytes, cursor)
            readUleb128(bytes, cursor)
        }

        for (int i = 0; i < directMethodsSize + virtualMethodsSize; i++) {
            readUleb128(bytes, cursor)
            readUleb128(bytes, cursor)
            int codeOff = readUleb128(bytes, cursor)
            if (codeOff != 0) {
                writeIntLe(bytes, codeOff + 8, 0)
            }
        }
    }

    updateDexHashes(bytes)
    bytes
}

boolean shouldDropApkEntry(ZipEntry entry, Map strippedDex) {
    def name = entry.name
    strippedDex.containsKey(name) ||
            name == 'META-INF/MANIFEST.MF' ||
            name.startsWith('META-INF/com/') ||
            (name.startsWith('META-INF/') &&
                    (name.endsWith('.RSA') || name.endsWith('.DSA') ||
                            name.endsWith('.EC') || name.endsWith('.SF')))
}

android {
    compileSdk {
        version = release(36) {
            minorApiLevel = 1
        }
    }
    buildToolsVersion "36.1.0"

    defaultConfig {
        applicationId "ka.xpomni"
        minSdkVersion 31
        targetSdkVersion 36
        versionCode 2
        versionName "1.0.1"
    }

    Properties localProperties = new Properties()
    if (project.rootProject.file('local.properties').exists()) {
        localProperties.load(project.rootProject.file('local.properties').newDataInputStream())
    }

    signingConfigs {
        if (localProperties.getProperty("storeFile") != null) {
            config {
                storeFile project.rootProject.file(localProperties.getProperty("storeFile"))
                storePassword localProperties.getProperty("storePassword")
                keyAlias localProperties.getProperty("keyAlias")
                keyPassword localProperties.getProperty("keyPassword")
            }
        }
    }

    buildTypes {
        configureEach {
            vcsInfo.include false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            if (localProperties.getProperty("storeFile") != null) {
                signingConfig signingConfigs.config
            }
        }
        release {
            if (localProperties.getProperty("storeFile") != null) {
                signingConfig signingConfigs.config
            } else {
                signingConfig signingConfigs.debug
            }
            vcsInfo.include false
            minifyEnabled true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    lint {
        checkReleaseBuilds false
    }

    packaging {
        resources {
            excludes += [
                    "kotlin/**",
                    "META-INF/com/**",
                    "META-INF/*.kotlin_module",
                    "META-INF/kotlin*",
                    "META-INF/versions/**",
                    "DebugProbesKt.bin"
            ]
        }
    }

    dependenciesInfo.includeInApk false
    enableKotlin = true
    namespace 'ka.xpomni'
}

dependencies {
    compileOnly 'androidx.annotation:annotation:1.9.1'
    compileOnly 'io.github.libxposed:api:101.0.1'
}

tasks.register('stripReleaseDexDebugInfo') {
    dependsOn 'packageRelease'

    doLast {
        def apk = layout.buildDirectory.file('outputs/apk/release/app-release.apk').get().asFile
        def workDir = layout.buildDirectory.dir('stripReleaseDexDebugInfo').get().asFile
        delete workDir
        workDir.mkdirs()

        def unsignedApk = new File(workDir, 'unsigned.apk')
        def alignedApk = new File(workDir, 'aligned.apk')
        def strippedDex = [:]

        new ZipFile(apk).withCloseable { zip ->
            zip.entries().each { entry ->
                if (entry.name ==~ /classes(\d*)?\.dex/) {
                    zip.getInputStream(entry).withCloseable { input ->
                        strippedDex[entry.name] = stripDexDebugInfo(input.bytes)
                    }
                }
            }
        }

        new ZipOutputStream(new BufferedOutputStream(new FileOutputStream(unsignedApk))).withCloseable { output ->
            new ZipFile(apk).withCloseable { zip ->
                zip.entries().each { entry ->
                    if (!shouldDropApkEntry(entry, strippedDex)) {
                        output.putNextEntry(new ZipEntry(entry.name))
                        if (!entry.directory) {
                            zip.getInputStream(entry).withCloseable { input ->
                                input.transferTo(output)
                            }
                        }
                        output.closeEntry()
                    }
                }
            }

            strippedDex.each { name, bytes ->
                output.putNextEntry(new ZipEntry(name))
                output.write(bytes)
                output.closeEntry()
            }
        }

        def windows = System.getProperty('os.name').toLowerCase(Locale.ROOT).contains('windows')
        def sdkPath = System.getenv('ANDROID_HOME') ?: System.getenv('ANDROID_SDK_ROOT')
        if (sdkPath == null && rootProject.file('local.properties').exists()) {
            def sdkProperties = new Properties()
            rootProject.file('local.properties').withInputStream { sdkProperties.load(it) }
            sdkPath = sdkProperties.getProperty('sdk.dir')
        }
        if (sdkPath == null) {
            throw new GradleException('ANDROID_HOME or sdk.dir is required to strip dex debug info.')
        }

        def buildTools = new File(sdkPath, "build-tools/${android.buildToolsVersion}")
        def zipalign = new File(buildTools, windows ? 'zipalign.exe' : 'zipalign')
        def apksigner = new File(buildTools, windows ? 'apksigner.bat' : 'apksigner')

        providers.exec {
            commandLine zipalign.absolutePath, '-f', '-p', '4', unsignedApk.absolutePath, alignedApk.absolutePath
        }.result.get().assertNormalExitValue()

        def signing = android.buildTypes.release.signingConfig
        if (signing == null || signing.storeFile == null) {
            throw new GradleException('Release signing config is required after stripping dex debug info.')
        }

        def signCommand = [
                apksigner.absolutePath,
                'sign',
                '--ks', signing.storeFile.absolutePath,
        ]
        if (signing.storePassword != null) {
            signCommand += ['--ks-pass', "pass:${signing.storePassword}"]
        }
        if (signing.keyAlias != null) {
            signCommand += ['--ks-key-alias', signing.keyAlias]
        }
        if (signing.keyPassword != null) {
            signCommand += ['--key-pass', "pass:${signing.keyPassword}"]
        }
        if (signing.storeType != null) {
            signCommand += ['--ks-type', signing.storeType]
        }
        signCommand += ['--out', apk.absolutePath, alignedApk.absolutePath]

        providers.exec {
            commandLine signCommand
        }.result.get().assertNormalExitValue()

        delete layout.buildDirectory.dir('outputs/mapping/release')
    }
}

afterEvaluate {
    tasks.named('assembleRelease').configure {
        finalizedBy 'stripReleaseDexDebugInfo'
    }
}
